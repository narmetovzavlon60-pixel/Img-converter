<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Конвертер изображений в PDF</title>
    <!-- Подключаем jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            background: #2563eb;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .upload-btn-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .previews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .preview-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #333;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
        .btn:disabled {
            background-color: #374151;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #2563eb;
        }
        #statusText {
            text-align: center;
            font-size: 0.9rem;
            color: #9ca3af;
            min-height: 20px;
        }
        #resultContainer {
            display: none;
            flex-direction: column;
            gap: 12px;
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Конвертер изображений в PDF</h2>

        <div class="upload-btn-wrapper">
            📁 Выбрать фотографии
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>

        <div class="previews" id="previewsContainer"></div>
        
        <div id="statusText">Выберите изображения для начала</div>

        <button class="btn" id="convertBtn" disabled>Сконвертировать в PDF</button>

        <!-- Блок результата на базе Data URI -->
        <div id="resultContainer">
            <div style="font-weight: bold; text-align: center; color: #10b981;">PDF успешно создан!</div>
            
            <!-- Прямая ссылка с Data URI для скачивания -->
            <a id="downloadLink" class="btn" download="document.pdf">💾 Скачать PDF файл</a>
            
            <!-- Кнопка принудительного открытия в новом окне -->
            <button class="btn btn-secondary" id="openBtn">🔍 Просмотреть / Открыть PDF</button>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let generatedDataUri = null;

        const imageInput = document.getElementById('imageInput');
        const previewsContainer = document.getElementById('previewsContainer');
        const convertBtn = document.getElementById('convertBtn');
        const statusText = document.getElementById('statusText');
        const resultContainer = document.getElementById('resultContainer');
        const downloadLink = document.getElementById('downloadLink');
        const openBtn = document.getElementById('openBtn');

        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            selectedFiles = Array.from(files);
            previewsContainer.innerHTML = '';
            resultContainer.style.display = 'none';

            selectedFiles.forEach((file) => {
                const objectURL = URL.createObjectURL(file);
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const img = document.createElement('img');
                img.src = objectURL;
                img.onload = () => URL.revokeObjectURL(objectURL);

                div.appendChild(img);
                previewsContainer.appendChild(div);
            });

            convertBtn.disabled = false;
            statusText.textContent = `Выбрано файлов: ${selectedFiles.length}`;
        });

        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            if (typeof window.jspdf === 'undefined') {
                statusText.textContent = '❌ Ошибка: Библиотека jsPDF не загружена';
                return;
            }

            convertBtn.disabled = true;
            statusText.textContent = '🔄 Инициализация генератора...';
            resultContainer.style.display = 'none';

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 10;

                for (let i = 0; i < selectedFiles.length; i++) {
                    statusText.textContent = `⏳ Обработка фото ${i + 1} из ${selectedFiles.length}...`;
                    
                    let dataUrl;
                    try {
                        dataUrl = await fileToCompressedDataUri(selectedFiles[i]);
                    } catch (err) {
                        throw new Error(`Сжатие файла ${i+1} не удалось: ${err.message}`);
                    }

                    let img;
                    try {
                        img = await loadImage(dataUrl);
                    } catch (err) {
                        throw new Error(`Ошибка загрузки изображения ${i+1}: ${err.message}`);
                    }

                    if (i > 0) {
                        pdf.addPage();
                    }

                    let imgWidth = pageWidth - (margin * 2);
                    let imgHeight = (img.height * imgWidth) / img.width;

                    if (imgHeight > (pageHeight - (margin * 2))) {
                        imgHeight = pageHeight - (margin * 2);
                        imgWidth = (img.width * imgHeight) / img.height;
                    }

                    const x = (pageWidth - imgWidth) / 2;
                    const y = (pageHeight - imgHeight) / 2;

                    try {
                        pdf.addImage(dataUrl, 'JPEG', x, y, imgWidth, imgHeight);
                    } catch (err) {
                        throw new Error(`Ошибка добавления в PDF: ${err.message}`);
                    }
                }

                statusText.textContent = '🔄 Финализация документа...';
                
                // Рендерим в Base64 (Data URI)
                generatedDataUri = pdf.output('datauristring');
                
                downloadLink.href = generatedDataUri;
                downloadLink.download = `document_${Date.now()}.pdf`;

                resultContainer.style.display = 'flex';
                statusText.textContent = '✅ Готово! Нажмите кнопку ниже.';
                convertBtn.disabled = false;

            } catch (error) {
                console.error(error);
                statusText.textContent = `❌ Сбой: ${error.message}`;
                convertBtn.disabled = false;
            }
        });

        openBtn.addEventListener('click', () => {
            if (!generatedDataUri) return;
            // Принудительно открываем Data URI в новом окне/вкладке
            const newWindow = window.open();
            if (newWindow) {
                newWindow.document.write(`<iframe src="${generatedDataUri}" style="width:100%; height:100%; border:none; margin:0; padding:0;"></iframe>`);
            } else {
                window.location.href = generatedDataUri;
            }
        });

        function fileToCompressedDataUri(file) {
            return new Promise((resolve, reject) => {
                const objectURL = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(objectURL);
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_DIM = 1200;
                    if (width > MAX_DIM || height > MAX_DIM) {
                        if (width > height) {
                            height = Math.round((height * MAX_DIM) / width);
                            width = MAX_DIM;
                        } else {
                            width = Math.round((width * MAX_DIM) / height);
                            height = MAX_DIM;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectURL);
                    reject(new Error('Не удалось прочитать файл как изображение'));
                };
                img.src = objectURL;
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Ошибка декодирования картинки'));
                img.src = src;
            });
        }
    </script>
</body>
</html>
