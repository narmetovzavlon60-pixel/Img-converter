<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест выбора файлов</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            font-family: monospace;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        /* Контейнер кнопки с относительным позиционированием */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            background: #2563eb;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        /* Инпут растянут на всю кнопку и полностью прозрачен, но доступен для прямого тапа */
        .upload-btn-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .previews {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .preview-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #333;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #consoleLog {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            height: 180px;
            overflow-y: auto;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
<h2>Тест прямого выбора файлов</h2>

        <!-- Прямой тап по прозрачному инпуту -->
        <div class="upload-btn-wrapper">
            📁 Выбрать фото с телефона
            <input type="file" id="imageInput" accept="image/*" multiple>
        </div>

        <div class="previews" id="previewsContainer"></div>

        <h3>Лог отладки:</h3>
        <div id="consoleLog">Ожидание действий...<br></div>
    </div>

    <script>
        const logBox = document.getElementById('consoleLog');
        function log(text) {
            console.log(text);
            logBox.innerHTML += `> ${text}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const imageInput = document.getElementById('imageInput');
        const previewsContainer = document.getElementById('previewsContainer');

        log("Скрипт инициализирован успешно.");

        imageInput.addEventListener('change', (e) => {
            log("🎯 Сработало событие change!");
            const files = e.target.files;
            
            if (!files || files.length === 0) {
                log("⚠️ Файлы не выбраны.");
                return;
            }

            log(`Успешно получено файлов: ${files.length}`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                log(`Файл [${i}]: ${file.name} (${file.type}, ${file.size} байт)`);

                try {
                    const objectURL = URL.createObjectURL(file);
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = objectURL;
                    img.onload = () => log(`✅ Превью [${i}] отрисовано`);
                    img.onerror = (err) => log(`❌ Ошибка картинки: ${err}`);

                    div.appendChild(img);
                    previewsContainer.appendChild(div);
                } catch (err) {
                    log(`❌ Ошибка ObjectURL: ${err.message}`);
                }
            }
        });
    </script>
</body>
</html>
